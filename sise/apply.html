  <p class="lede">파일럿이 열리면 안내 메일을 보낼게. 크롤링 위험 고지를 읽었다는 확인도 같이 받아.</p>

      <select name="channel">
        <option value="">선택</option>
        <option>쿠팡</option>
        <option>스마트스토어</option>
        <option>둘 다 / 기타</option>
      </select>
    </label>
    <label>하고 싶은 말 <span class="hint">(선택)</span><textarea name="message"></textarea></label>
    <label class="small"><input type="checkbox" name="legal_ack" required> <a href="legal.html">법적 고지</a>를 읽었고, 이 서비스가 그레이 영역일 수 있다는 점을 이해했어.</label>
    <label class="small"><input type="checkbox" name="consent" required> 사전 안내 메일 발송을 위해 이름·이메일을 저장하는 데 동의해.</label>
    <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off">
    <input type="hidden" name="_subject" value="셀러시세 대기 명단">
    <div class="cta-row"><button class="btn" type="submit">신청하기</button></div>
