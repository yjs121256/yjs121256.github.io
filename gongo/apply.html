  <span class="badge">사전 신청 · 결제 없음</span>
  <h1>알림 사전 신청</h1>
  <p class="lede">서비스가 열리면 안내 메일을 보낼게. 지금은 구독료를 받지 않아.</p>

    <label>이름 <input name="name" required autocomplete="name"></label>
    <label>이메일 <input name="email" type="email" required autocomplete="email"></label>
    <label>관심 업종
      <select name="interest" required>
        <option value="">선택</option>
        <option>조경</option>
        <option>소방</option>
        <option>둘 다</option>
      </select>
    </label>
    <label>관심 지역 <span class="hint">(선택, 예: 광주·전남, 전국)</span>
      <input name="region" autocomplete="off">
    </label>
    <label>하고 싶은 말 <span class="hint">(선택)</span><textarea name="message"></textarea></label>
    <label class="small"><input type="checkbox" name="consent" required> 사전 안내 메일 발송을 위해 이름·이메일을 저장하는 데 동의해.</label>
    <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off">
    <input type="hidden" name="_subject" value="틈새공고 사전 신청">
